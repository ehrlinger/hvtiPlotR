# Workflow derived from https://github.com/r-lib/actions/tree/master/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: lint

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # Enforcing, as the house standard requires. The 98 pre-existing lints
      # this repo carried are gone (#89), and .lintr now states the three
      # deviations from lintr's defaults with the reason for each.
      #
      # A lint that is genuinely a false positive belongs behind a `# nolint`
      # carrying its reason, next to the code it excuses. Widening a rule in
      # .lintr to clear one site turns a local exception into a standing
      # permission, which is how the debt accumulated the first time.
      LINTR_ERROR_ON_LINT: true
    steps:
      - uses: actions/checkout@v4

      # Before R is set up: it needs only bash, grep and perl, so a British
      # spelling fails the job in seconds rather than after the dependencies.
      - name: US spelling
        run: bash tools/check-us-spelling.sh

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # local::. installs the package itself, not just its dependencies.
          # Without it object_usage_linter cannot resolve the package's own
          # internals and reports every call to one as an undefined global.
          extra-packages: any::lintr, local::.

      - name: Lint
        run: lintr::lint_package()
        shell: Rscript {0}

  house-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # This job executes a script checked out from another repository.
          # Not persisting the token keeps it out of .git/config for every
          # step that follows, so a later `git` call cannot reach the remote
          # with this repo's credentials.
          persist-credentials: false

      - name: Check out the house style composer
        uses: actions/checkout@v4
        with:
          repository: ehrlinger/house-style
          # Pinned to a tag, not the default branch: an in-progress change to
          # the composer must not redden this repo's CI. The tag moves when the
          # standard changes, which is exactly when every repo should start
          # reporting drift until it recomposes.
          ref: house-style-v1
          path: .house-style-tools
          persist-credentials: false

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Only the composer's two dependencies. This job never builds the
      # package, so resolving the full DESCRIPTION tree would cost minutes
      # to install code nothing here calls.
      - name: Install composer dependencies
        run: install.packages(c("yaml", "digest"))
        shell: Rscript {0}

      - name: Point the registry at this checkout
        run: |
          # repos.yml carries workstation paths; CI must repoint this entry at
          # the runner's checkout. A sed that matches nothing exits 0, and the
          # failure would surface two steps later as "path not found" drift --
          # a true failure with a misleading cause. Check first and say so.
          if ! grep -qE 'path: ~/Documents/GitHub/hvtiPlotR$' .house-style-tools/repos.yml; then
            echo "::error::repos.yml no longer contains 'path: ~/Documents/GitHub/hvtiPlotR'. The registry format or this repo's entry changed upstream; update this workflow rather than trusting the check." >&2
            exit 1
          fi
          # & means "the whole match" to sed, and \ and the | delimiter are
          # special too. GITHUB_WORKSPACE is /home/runner/work/<repo>/<repo>
          # on a hosted runner, built from names GitHub restricts to
          # alphanumerics, hyphen, underscore and period, so none of them can
          # appear. Escaping anyway costs one line and removes the need to
          # know that -- and keeps this correct on a self-hosted runner whose
          # workspace root is not so constrained.
          workspace=$(printf '%s' "$GITHUB_WORKSPACE" | sed 's/[&|\\]/\\&/g')
          sed -i "s|path: ~/Documents/GitHub/hvtiPlotR$|path: $workspace|" \
            .house-style-tools/repos.yml

      - name: Verify the house style artifact is current
        run: |
          Rscript .house-style-tools/compose-house-style.R \
            --check --repo hvtiPlotR

  # A change that ships must carry its NEWS entry as a news/<branch>.md
  # fragment. Entries live in their own files so open pull requests stop
  # conflicting at the top of NEWS.md, which also means a forgotten one is no
  # longer a missing line in a diff anyone reads. Ships nothing (the base
  # branch's .Rbuildignore covers every file) and the bump (Version: moved, or
  # fragments collected) both pass. Python only, no R, so it takes seconds.
  news-fragment:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the base branch, to diff against

      - name: Test the fragment tooling
        run: python3 -m unittest discover -s .github/scripts -p 'test_news.py'

      - name: A change that ships carries a news/ fragment
        run: python3 .github/scripts/news.py check --base "origin/${{ github.base_ref }}"
